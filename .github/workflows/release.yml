name: Release

# Push a tag like v1.0.1 to build a signed APK and publish it as a GitHub Release.
# The app checks the latest release on launch and offers the update in place.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the Android SDK ($ANDROID_HOME); AGP fetches missing platforms itself

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PROSKETCH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::PROSKETCH_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PROSKETCH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed GitHub APK and Play bundle
        env:
          PROSKETCH_KEYSTORE_PASSWORD: ${{ secrets.PROSKETCH_KEYSTORE_PASSWORD }}
          PROSKETCH_KEY_ALIAS: ${{ secrets.PROSKETCH_KEY_ALIAS }}
          PROSKETCH_KEY_PASSWORD: ${{ secrets.PROSKETCH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease bundlePlayRelease -PappVersion=${{ steps.ver.outputs.version }} --no-configuration-cache
          cp app/build/outputs/apk/github/release/app-github-release.apk "ProSketch-${{ steps.ver.outputs.tag }}.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "ProSketch-${{ steps.ver.outputs.tag }}-play.aab"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "ProSketch-${{ steps.ver.outputs.tag }}.apk" | head -3

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          APK="ProSketch-$TAG.apk"
          PREV=$(git tag --sort=-v:refname | grep -v "^$TAG$" | head -1 || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          { echo "## 변경 사항"; git log --pretty='- %s' $RANGE | grep -v -E '^- (Merge|CI:|Release v)' | head -40
            echo; echo "설치: 태블릿에서 \`$APK\`를 내려받아 실행하거나, 앱의 [업데이트 확인]을 누르세요."; } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "ProSketch-$TAG-play.aab" --clobber
          else
            gh release create "$TAG" "$APK" "ProSketch-$TAG-play.aab" --title "ProSketch $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
